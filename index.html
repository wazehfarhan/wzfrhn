<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>W2ZFRHN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">
      <main class="main">
        <!-- Profile Header (Dynamic) -->
        <div class="profile-header">
          <div class="profile-avatar" id="profile-avatar"></div>
          <div class="profile-info">
            <h1 class="profile-name">
              <span id="profile-name"></span><span class="accent">_</span>
            </h1>
            <p class="profile-tagline" id="profile-tagline"></p>
            <div class="profile-badges" id="profile-badges"></div>
            <!-- Navigation below badges -->
            <nav class="profile-nav" id="profileNav">
              <button class="nav-item active" data-tab="feed">Feed</button>
              <button class="nav-item" data-tab="about">About</button>
              <button class="nav-item" data-tab="projects">Projects</button>
              <button class="nav-item" data-tab="resume">Resume</button>
            </nav>
          </div>
        </div>

        <!-- FEED -->
        <section id="tab-feed" class="tab-content">
          <!-- Latest Post Section -->
          <div class="sh">
            <span class="st">Latest Story</span>
            <div class="sl"></div>
          </div>
          <div id="latest-post"></div>

          <!-- Other Stories Section -->
          <div class="sh" style="margin-top: 40px">
            <span class="st">Other Stories</span>
            <div class="sl"></div>
          </div>
          <div id="other-stories"></div>
        </section>

        <!-- ABOUT -->
        <section id="tab-about" class="tab-content" style="display: none">
          <div class="sh">
            <span class="st">About Me</span>
            <div class="sl"></div>
          </div>
          <div class="fc">
            <div class="prose" id="about-content"></div>
          </div>
        </section>

        <!-- PROJECTS -->
        <section id="tab-projects" class="tab-content" style="display: none">
          <div class="sh">
            <span class="st">Projects</span>
            <div class="sl"></div>
          </div>
          <div class="grid" id="projects-container"></div>
        </section>

        <!-- RESUME -->
        <section id="tab-resume" class="tab-content" style="display: none">
          <div class="sh">
            <span class="st">Resume</span>
            <div class="sl"></div>
          </div>
          <div class="rc">
            <div class="rh">
              <div>
                <div
                  style="font-size: 19px; font-weight: 800"
                  id="resume-name"
                ></div>
                <div
                  style="color: var(--muted); font-size: 13px; margin-top: 3px"
                  id="resume-title"
                ></div>
              </div>
              <a href="#" class="dlbtn">⬇ Download PDF</a>
            </div>
            <div style="border-top: 1px solid var(--border); padding-top: 18px">
              <div
                style="
                  font-size: 11px;
                  letter-spacing: 2px;
                  text-transform: uppercase;
                  color: var(--muted);
                  font-weight: 700;
                  margin-bottom: 14px;
                "
              >
                Experience
              </div>
              <div class="exps" id="experience-container"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <a class="fab" href="mailto:wzullah.farhan@gmail.com">✉</a>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
